# 本機啟動 Qdrant：
#   cd ai_visitor_analysis
#   docker compose -f docker-compose.qdrant.yml up -d
#
# Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
